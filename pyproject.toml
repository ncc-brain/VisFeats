[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "visfeats"
dynamic = ["version"]
description = "A library for extracting global visual features"
readme = "README.md"
authors = [{ name = "Qian Chu", email = "qianchu99@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["scikit-image"]

[project.optional-dependencies]
resmem = ["resmem"]
dev = ["resmem", "pytest", "pre-commit"]
docs = ["sphinx", "pydata-sphinx-theme", "numpydoc", "myst-parser"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:The parameter 'pretrained' is deprecated:UserWarning:torchvision",
    "ignore:Arguments other than a weight enum:UserWarning:torchvision",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
local_scheme = "node-and-date"
