name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # Official Python images are used because setup-python no longer ships 3.6 for current Ubuntu runners.
    container: python:${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.6", "3.8", "3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest
